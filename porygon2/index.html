<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Porygon2 & Chief · Pixel Viewer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#171a23;color:white;font:14px system-ui}canvas{display:block;touch-action:none;image-rendering:pixelated}#panel{position:absolute;z-index:2;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:14px;pointer-events:none;background:linear-gradient(#171a23dd,transparent)}#panel>*{pointer-events:auto}button{cursor:pointer}button{background:#343b4c;color:white;border:1px solid #657086;border-radius:8px;padding:8px 12px}#status{font-size:12px;opacity:.85}#help{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;font-size:12px;opacity:.7}</style></head><body>
<div id="panel"><button id="prev" aria-label="Previous model">←</button><b id="name">Porygon2</b><button id="next" aria-label="Next model">→</button><button id="reset">Reset view</button><span id="status">Loading model…</span></div><div id="help">Drag to rotate · Pinch to zoom · Two-finger drag to pan</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';
const status=document.querySelector('#status'), scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false});
renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const palette={red:new THREE.Color('#c84850'),blue:new THREE.Color('#5060c0'),white:new THREE.Color('#ffffff'),black:new THREE.Color('#000000')};
const light=new THREE.Vector3(3,5,4).normalize();
const vertex=`varying vec3 nWorld;void main(){nWorld=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fragment=`uniform float part;uniform vec3 lightDir;varying vec3 nWorld;void main(){
float d=dot(normalize(nWorld),normalize(lightDir));
vec3 red=vec3(200.,72.,80.)/255.,blue=vec3(80.,96.,192.)/255.;
vec3 c=red;
if(part>2.5)c=vec3(0.);
else if(part>1.5)c=vec3(1.);
else if(part>0.5)c=d>0.72?vec3(1.):blue;
gl_FragColor=vec4(c,1.);
}`;
function partOf(mesh){const n=(mesh.name+' '+(mesh.material?.name||'')).toLowerCase();if(/pupil/.test(n))return 3;if(/glint|highlight|eye/.test(n))return 2;if(/foot|feet|tail|neck/.test(n))return 1;return 0;}
let model;let current=0;let loading=0;
const models=[{name:'Porygon2',file:'./Porygon2.obj',type:'shader'},{name:'Chief',file:'./chief/chief-snap-lettered.obj',mtl:'./chief/chief.mtl',type:'textured'}];
function reset(){if(!model)return;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size*.75,size*.48,size));camera.near=Math.max(.001,size/1000);camera.far=size*100;camera.updateProjectionMatrix();controls.update();}
document.querySelector('#reset').onclick=reset;
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const post=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{tex:{value:null},stepSize:{value:new THREE.Vector2()},bg:{value:new THREE.Color('#171a23')}},vertexShader:`varying vec2 uv0;void main(){uv0=uv;gl_Position=vec4(position.xy,0.,1.);}`,
fragmentShader:`uniform sampler2D tex;uniform vec2 stepSize;uniform vec3 bg;varying vec2 uv0;
void main(){vec4 c=texture2D(tex,uv0);if(c.a>.5){gl_FragColor=vec4(c.rgb,1.);return;}
vec3 red=vec3(200.,72.,80.)/255.,blue=vec3(80.,96.,192.)/255.;
float best=99.;vec3 nearest=vec3(0.);vec2 direction=vec2(0.);
for(int y=-2;y<=2;y++)for(int x=-2;x<=2;x++){float dist=float(x*x+y*y);if(dist>4.)continue;vec4 p=texture2D(tex,uv0+vec2(float(x),float(y))*stepSize);if(p.a>.5&&dist<best){best=dist;nearest=p.rgb;direction=vec2(float(x),float(y));}}
if(best<99.){bool illuminated=dot(normalize(direction+vec2(.0001)),normalize(vec2(1.,-1.)))>.15;vec3 edge=vec3(0.);if(illuminated){if(distance(nearest,red)<.12)edge=red;else if(distance(nearest,blue)<.12||distance(nearest,vec3(1.))<.12)edge=blue;}gl_FragColor=vec4(edge,1.);}else gl_FragColor=vec4(bg,1.);
}`});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),post));
let target;
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);const ih=160,iw=Math.max(1,Math.round(w/h*ih));target?.dispose();target=new THREE.WebGLRenderTarget(iw,ih,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,depthBuffer:true});target.texture.colorSpace=THREE.SRGBColorSpace;post.uniforms.tex.value=target.texture;post.uniforms.stepSize.value.set(1/iw,1/ih);}
addEventListener('resize',resize);resize();
async function selectModel(index){
 const token=++loading;
 const next=(index+models.length)%models.length, entry=models[next];
 status.textContent='Loading '+entry.name+'…';
 try{
  let loader=new OBJLoader();
  if(entry.mtl){
   const materials=await new MTLLoader().setResourcePath('./chief/').loadAsync(entry.mtl);
   materials.preload();loader.setMaterials(materials);
  }
  const root=await loader.loadAsync(entry.file);
  if(token!==loading)return;
  let count=0;
  root.traverse(o=>{
   if(!o.isMesh)return;
   count++;o.geometry.computeVertexNormals();
   if(entry.type==='shader')o.material=new THREE.ShaderMaterial({vertexShader:vertex,fragmentShader:fragment,uniforms:{part:{value:partOf(o)},lightDir:{value:light}},side:THREE.DoubleSide});
   else{
    const list=Array.isArray(o.material)?o.material:[o.material];
    for(const m of list){m.side=THREE.DoubleSide;m.flatShading=true;m.needsUpdate=true;}
   }
  });
  if(model)scene.remove(model);
  model=root;scene.add(model);current=next;
  document.querySelector('#name').textContent=entry.name;
  reset();status.textContent=count+' meshes · '+(entry.type==='shader'?'four-colour mode':'Snap textures');
 }catch(e){status.textContent='Failed to load '+entry.name;console.error(e);}
}
document.querySelector('#prev').onclick=()=>selectModel(current-1);
document.querySelector('#next').onclick=()=>selectModel(current+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')selectModel(current-1);if(e.key==='ArrowRight')selectModel(current+1);});
selectModel(0);
function frame(){requestAnimationFrame(frame);controls.update();renderer.setRenderTarget(target);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);}frame();
</script></body></html>
